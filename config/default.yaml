# Branchseed default configuration
# Every numeric threshold used anywhere in src/ MUST live here.
# See branchseed_playbook.md §7 for the rationale behind each value.

# geometry / preprocessing
iso_mm: 1.0                 # isotropic resample spacing (mm)
roi_margin_mm: 50.0         # padding around the aorta bounding box (mm)

# intensity thresholds (all relative to the aortic lumen)
k_vessel: 3.0               # t_vessel = a_med - k_vessel*(a_med - a_p10)
frac_vessel: 0.35           # ...floored at frac_vessel * a_med
frac_high: 0.75             # hysteresis seed level
vessel_hu_floor: 120.0      # absolute floor, never threshold below this
bone_offset: 300.0          # t_bone = a_med + bone_offset
bone_dilate_mm: 1.5
max_stray_cc_ml: 50.0       # drop unattached components larger than this

# aortic frame / forbidden surface
centreline_smooth_mm: 10.0
endcap_mm: 4.0              # exclude wall within this of the mask's top/bottom
endcap_angle_deg: 35.0      # exclude wall whose normal aligns with the axis
iliac_margin_mm: 3.0
iliac_fork_size_ratio: 0.3  # 2D slice components with size ratio >= this count as "comparable" (the fork)

# instancing (§5.6/§5.7 component bookkeeping)
max_branch_voxels: 50000    # skip a candidate component larger than this outright -- it's a leak into bone/organ, not a branch
patch_bridge_mm: 6.0        # owner: A -- gap (mm) between a candidate component and its contact patch on the legal wall, after the 1-voxel aorta-mask buffer is stripped out in find_raw_branches; real cases (unlike the synthetic phantom) show gaps up to ~5-6mm (partial-volume/segmentation noise at the aortic wall), so the fixed 2-voxel bridge that worked on synthetic data missed almost every real branch (see docs/team_playbook.md recall-hunting notes, case orig19 real-data smoke test)

# branch tracing
trace_max_mm: 10.0
seed_arc_mm: 5.0
path_step_mm: 0.5
pca_window_mm: [1.0, 7.0]
seed_snap_mm: 1.5

# eligibility gate
min_extent_mm: 5.0
max_extent_mm: 40.0         # owner: A -- reject candidates whose geodesic extent alone rules out a proximal branch stub (real cases show 50-200mm leaks into bone/organ)
min_radius_mm: 0.8          # <<< THE UNANNOUNCED SIZE RULE. Sweep 0.5-2.0 first.
patch_area_min_mm2: 1.0
patch_area_max_mm2: 120.0
hu_ratio_min: 0.65  # owner: A -- lowered from 0.70 after pass #4: verified isolated to orig22 (0 low_hu_ratio rejections on the other 4 dev cases at 0.70), rescues exactly one otherwise-plausible candidate (extent 9.97mm, patch_area 19mm^2, xsec 1.50mm^2) with zero effect elsewhere -- see docs/scoreboard.md pass #4
min_mean_cross_section_mm2: 1.5  # owner: A -- real-data noise floor: single/few-voxel threshold specks clear min_extent_mm only because the wall-bridge dilation inflates their geodesic_extent_mm; genuine branch stubs measured >=~4mm^2 on the dev set, noise sat <=~1.5mm^2 (see docs/scoreboard.md pass #3)
max_mean_cross_section_mm2: 50.0  # owner: A -- reject blobby leaks (bone/organ); real celiac/SMA top out ~38mm2 (r~3.5mm)
tortuosity_max: 2.0

# de-duplication
dedup_dist_mm: 3.0
dedup_angle_deg: 30.0

# runtime
verbose: true
log_rejections: true        # log every rejected candidate with its reason

# visual report (§9.1, §9.2)
report_axial_half_window_mm: 40.0   # axial-slice strip crop half-width around the centreline
report_arrow_length_mm: 10.0        # direction-arrow length drawn on MIPs / axial slices
report_marker_min_pt: 4.0           # unrolled-map circle size floor (points)
report_marker_scale_pt: 6.0         # unrolled-map circle size per mm of radius (points/mm)
